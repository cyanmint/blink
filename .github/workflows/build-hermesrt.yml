name: Build hermesrt.zip

on:
  push:
    paths:
      - 'hermes/**'
      - 'install_hermes_runtime.sh'
      - '.github/workflows/build-hermesrt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache Hermes compilation
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hermes-build/native-ios
          key: ${{ runner.os }}-hermes-ios-${{ hashFiles('hermes/build/*.sh', 'hermes/overlay/**', 'hermes/patches/**') }}
          restore-keys: |
            ${{ runner.os }}-hermes-ios-

      - name: Build Hermes runtime
        env:
          BUILD_ROOT: ${{ runner.temp }}/hermes-build/native-ios
          IPHONEOS_DEPLOYMENT_TARGET: '16.1'
          JOBS: 4
        run: |
          set -euo pipefail
          chmod +x hermes/build/*.sh
          bash hermes/build/build-native-ios.sh

      - name: Validate hermesrt.zip and framework
        run: |
          set -euo pipefail
          test -x hermes/Frameworks/HermesRuntime.framework/HermesRuntime
          test -s hermes/hermesrt.zip
          unzip -t hermes/hermesrt.zip
          python3 - hermes/hermesrt.zip <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = set(archive.namelist())
              assert 'hermes-runtime.timestamp' in names
              assert archive.read('hermes-runtime.timestamp').strip().isdigit()
              assert 'hermes/hermes_cli/main.py' in names
              assert 'python/encodings/__init__.py' in names
          PY

      - name: Stage runtime artifact
        run: |
          set -euo pipefail
          rm -rf runtime-artifact
          mkdir -p runtime-artifact
          cp hermes/hermesrt.zip runtime-artifact/hermesrt.zip
          cp -R hermes/Frameworks runtime-artifact/Frameworks

      - name: Upload latest Hermes runtime
        uses: actions/upload-artifact@v4
        with:
          name: hermesrt-runtime
          path: runtime-artifact
          if-no-files-found: error
          retention-days: 30
