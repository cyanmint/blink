name: Build Hermes iOS runtime

on:
  workflow_call:
    inputs:
      ios-sdk-version:
        description: The Theos iPhoneOS SDK version to use
        required: false
        type: string
        default: '16.5'
    outputs:
      artifact-name:
        description: Artifact containing HermesRuntime.framework and hermesrt.zip
        value: hermes-ios-runtime

jobs:
  build-hermes:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out Blink
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make curl git pkg-config zlib1g-dev libssl-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Restore incremental Hermes build cache
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_TAG: native-ios-build-cache
          CACHE_NAME: native-ios-build-cache.tar.gz
          BUILD_ROOT: ${{ runner.temp }}/hermes-build/native-ios
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$BUILD_ROOT")"
          if gh release view "$CACHE_TAG" >/dev/null 2>&1; then
            gh release download "$CACHE_TAG" --pattern "$CACHE_NAME" \
              --dir "$RUNNER_TEMP/native-ios-cache" --clobber || true
          fi
          cache="$RUNNER_TEMP/native-ios-cache/$CACHE_NAME"
          if [ -s "$cache" ]; then
            tar -xzf "$cache" -C "$(dirname "$BUILD_ROOT")"
            test -d "$BUILD_ROOT"
            echo "Restored incremental build cache"
          else
            echo "No incremental build cache found; starting clean"
          fi

      - name: Build native Hermes and hermesrt.zip
        env:
          IOS_SDK_VERSION: ${{ inputs.ios-sdk-version }}
          BUILD_ROOT: ${{ runner.temp }}/hermes-build/native-ios
          JOBS: 4
        run: |
          chmod +x hermes/build/*.sh
          hermes/build/build-native-ios.sh

      - name: Validate runtime artifacts
        run: |
          test -x hermes/HermesRuntime.framework/HermesRuntime
          test -s hermes/hermesrt.zip
          file hermes/HermesRuntime.framework/HermesRuntime
          unzip -t hermes/hermesrt.zip
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('hermes/hermesrt.zip') as archive:
              names = set(archive.namelist())
              required = {'python/encodings/__init__.py', 'hermes/hermes_cli/main.py'}
              missing = required - names
              if missing:
                  raise SystemExit(f'missing runtime entries: {sorted(missing)}')
              if any(name.endswith(('.so', '.dylib', '.pyd', '.wasm')) for name in names):
                  raise SystemExit('runtime archive contains a forbidden dynamic artifact')
          PY

      - name: Update incremental Hermes build cache release
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_TAG: native-ios-build-cache
          CACHE_NAME: native-ios-build-cache.tar.gz
          BUILD_ROOT: ${{ runner.temp }}/hermes-build/native-ios
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/$CACHE_NAME"
          tar -czf "$cache" -C "$(dirname "$BUILD_ROOT")" "$(basename "$BUILD_ROOT")"
          if ! gh release view "$CACHE_TAG" >/dev/null 2>&1; then
            gh release create "$CACHE_TAG" --title "Hermes native iOS incremental build cache" --notes "Managed by build-hermes workflow."
          fi
          gh release upload "$CACHE_TAG" "$cache#$CACHE_NAME" --clobber

      - name: Upload Hermes runtime
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ios-runtime
          path: |
            hermes/HermesRuntime.framework
            hermes/hermesrt.zip
          if-no-files-found: error
          retention-days: 14
