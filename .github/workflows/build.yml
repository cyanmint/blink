name: Build HermesLink

on:
  push:
  workflow_dispatch:
    inputs:
      runtime:
        description: Run the Linux runtime stage
        required: true
        type: choice
        options:
          - true
          - false
        default: false
      app:
        description: Run the macOS app stage
        required: true
        type: choice
        options:
          - true
          - false
        default: false
      run_tests:
        description: Run HermesLink simulator tests before archiving
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

# The runtime is published to one mutable release tag. Serialize runs so a
# second push cannot delete/replace the asset while an app job is downloading
# it from the previous run.
concurrency:
  group: hermeslink-${{ github.ref }}
  cancel-in-progress: false

env:
  HERMES_RUNTIME_RELEASE_TAG: hermesrt-latest

jobs:
  decide:
    name: Decide build stages
    runs-on: ubuntu-latest
    outputs:
      run_runtime: ${{ steps.decision.outputs.run_runtime }}
      run_app: ${{ steps.decision.outputs.run_app }}
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed components
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          RUNTIME_OVERRIDE: ${{ inputs.runtime || 'auto' }}
          APP_OVERRIDE: ${{ inputs.app || 'auto' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            changed_files=''
          else
            # Use the files listed in this push event. This covers every commit
            # included in the push, rather than inspecting only HEAD^.
            changed_files="$(jq -r '.commits[]? | (.added[]?, .modified[]?, .removed[]?)' "$EVENT_PATH")"
            # GitHub may omit the commit list for an unusually large push.
            # In that case, compare the push's before/after range, not one commit.
            if [ -z "$changed_files" ] && [ -n "$BEFORE_SHA" ] && \
               [ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]; then
              changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" 2>/dev/null || \
                git diff --name-only HEAD^ HEAD)"
            fi
          fi

          runtime_changed=false
          app_changed=false
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              hermes/*|install_hermes_runtime.sh|.github/workflows/*)
                runtime_changed=true
                ;;
            esac
            case "$path" in
              Blink/*|BlinkTests/*|Settings/*|Sessions/*|Resources/*|Media.xcassets/*|*.xcodeproj/*|*.xcconfig|Frameworks/*|get_frameworks.sh|get_resources.sh|install_hermes_runtime.sh|.github/workflows/*)
                app_changed=true
                ;;
            esac
          done <<< "$changed_files"

          choose() {
            case "$1" in
              true) printf 'true' ;;
              false) printf 'false' ;;
              auto) printf '%s' "$2" ;;
              *) echo "invalid override: $1" >&2; exit 2 ;;
            esac
          }
          run_runtime="$(choose "$RUNTIME_OVERRIDE" "$runtime_changed")"
          run_app="$(choose "$APP_OVERRIDE" "$app_changed")"
          printf 'runtime_changed=%s app_changed=%s override_runtime=%s override_app=%s\n' \
            "$runtime_changed" "$app_changed" "$RUNTIME_OVERRIDE" "$APP_OVERRIDE"
          printf 'run_runtime=%s\n' "$run_runtime" >> "$GITHUB_OUTPUT"
          printf 'run_app=%s\n' "$run_app" >> "$GITHUB_OUTPUT"
          printf 'run_runtime=%s run_app=%s\n' "$run_runtime" "$run_app"

  build-runtime-zip:
    name: Build pure-Python hermesrt.zip (Linux)
    needs: decide
    if: needs.decide.outputs.run_runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v4

      - name: Set up host Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build and validate pure-Python runtime archive
        env:
          BUILD_ROOT: ${{ runner.temp }}/hermes-build/python-runtime
          CPYTHON_ROOT: ${{ runner.temp }}/hermes-build/cpython
          CPYTHON_REF: v3.13.9
        run: |
          set -euo pipefail
          chmod +x hermes/build/*.sh
          bash hermes/build/build-hermesrt-zip.sh

      - name: Upload pure-Python runtime archive
        uses: actions/upload-artifact@v4
        with:
          name: hermesrt-zip
          path: hermes/hermesrt.zip
          if-no-files-found: error
          retention-days: 1

  build-native-runtime:
    name: Build native iOS runtime (macOS)
    needs: decide
    if: needs.decide.outputs.run_runtime == 'true'
    runs-on: macos-latest
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache Hermes compilation
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hermes-build/native-ios
          key: ${{ runner.os }}-hermes-ios-${{ hashFiles('hermes/build/*.sh', 'hermes/overlay/**', 'hermes/patches/**') }}
          restore-keys: |
            ${{ runner.os }}-hermes-ios-

      - name: Build native iOS runtime only
        env:
          BUILD_ROOT: ${{ runner.temp }}/hermes-build/native-ios
          IPHONEOS_DEPLOYMENT_TARGET: '16.1'
          HERMES_BUILD_RUNTIME_ZIP: '0'
          JOBS: 4
        run: |
          set -euo pipefail
          chmod +x hermes/build/*.sh
          bash hermes/build/build-native-ios.sh
          test -x hermes/Frameworks/HermesRuntime.framework/HermesRuntime

      - name: Package native framework
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            hermes/Frameworks/HermesRuntime.framework \
            hermes/HermesRuntime.framework.zip

      - name: Upload native framework
        uses: actions/upload-artifact@v4
        with:
          name: hermes-native-framework
          path: hermes/HermesRuntime.framework.zip
          if-no-files-found: error
          retention-days: 1

  publish-runtime:
    name: Publish runtime artifacts
    needs: [decide, build-runtime-zip, build-native-runtime]
    if: needs.decide.outputs.run_runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v4

      - name: Download pure-Python archive
        uses: actions/download-artifact@v4
        with:
          name: hermesrt-zip
          path: runtime-artifact

      - name: Download native framework archive
        uses: actions/download-artifact@v4
        with:
          name: hermes-native-framework
          path: runtime-artifact

      - name: Validate release payloads
        run: |
          set -euo pipefail
          test -s runtime-artifact/hermesrt.zip
          test -s runtime-artifact/HermesRuntime.framework.zip
          python3 hermes/build/validate-runtime-zip.py runtime-artifact/hermesrt.zip
          unzip -t runtime-artifact/HermesRuntime.framework.zip

      - name: Publish assets to fixed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Recreate the mutable release instead of using --clobber. GitHub
          # can retain a stale asset id after an interrupted upload; gh then
          # receives 404 while trying to replace an asset that still appears
          # in the release metadata.
          if gh release view "$HERMES_RUNTIME_RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$HERMES_RUNTIME_RELEASE_TAG" --yes
          fi
          gh release create "$HERMES_RUNTIME_RELEASE_TAG" \
            --title 'Hermes runtime (latest)' \
            --notes 'Pure-Python runtime archive and native iOS framework used by HermesLink app builds.'
          gh release upload "$HERMES_RUNTIME_RELEASE_TAG" \
            runtime-artifact/hermesrt.zip runtime-artifact/HermesRuntime.framework.zip

  build-app:
    name: Build HermesLink app
    needs: [decide, build-runtime-zip, build-native-runtime]
    if: >-
      always() &&
      needs.decide.outputs.run_app == 'true' &&
      (
        (
          needs.decide.outputs.run_runtime == 'true' &&
          needs.build-runtime-zip.result == 'success' &&
          needs.build-native-runtime.result == 'success'
        ) ||
        (
          needs.decide.outputs.run_runtime != 'true' &&
          needs.build-runtime-zip.result == 'skipped' &&
          needs.build-native-runtime.result == 'skipped'
        )
      )
    runs-on: macos-latest
    steps:
      - name: Check out HermesLink
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download pure-Python archive from runtime build
        if: needs.decide.outputs.run_runtime == 'true'
        uses: actions/download-artifact@v4
        with:
          name: hermesrt-zip
          path: runtime-artifact/python

      - name: Download native framework from runtime build
        if: needs.decide.outputs.run_runtime == 'true'
        uses: actions/download-artifact@v4
        with:
          name: hermes-native-framework
          path: runtime-artifact/native

      - name: Download runtime assets from fixed release
        if: needs.decide.outputs.run_runtime != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p runtime-artifact/python runtime-artifact/native
          curl --fail --location --retry 5 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/octet-stream' \
            --output runtime-artifact/python/hermesrt.zip \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${HERMES_RUNTIME_RELEASE_TAG}/hermesrt.zip"
          test -s runtime-artifact/python/hermesrt.zip
          curl --fail --location --retry 5 --retry-all-errors \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/octet-stream' \
            --output runtime-artifact/native/HermesRuntime.framework.zip \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${HERMES_RUNTIME_RELEASE_TAG}/HermesRuntime.framework.zip"
          test -s runtime-artifact/native/HermesRuntime.framework.zip

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Compute runtime cache key
        id: runtime_hash
        run: |
          set -euo pipefail
          python_hash="$(shasum -a 256 runtime-artifact/python/hermesrt.zip | awk '{print $1}')"
          framework_hash="$(shasum -a 256 runtime-artifact/native/HermesRuntime.framework.zip | awk '{print $1}')"
          printf 'sha256=%s-%s\n' "$python_hash" "$framework_hash" >> "$GITHUB_OUTPUT"

      - name: Cache unsigned app archive
        id: app_build_cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/HermesLink.xcarchive
            ${{ runner.temp }}/hermeslink-archive.log
          key: ${{ runner.os }}-hermes-app-${{ github.sha }}-${{ steps.runtime_hash.outputs.sha256 }}-${{ hashFiles('Blink.xcodeproj/**', 'Blink/**', 'Settings/**', 'Sessions/**', 'Resources/**', 'Media.xcassets/**', 'Frameworks/**', '*.xcconfig', 'hermes/build/**', 'install_hermes_runtime.sh') }}

      - name: Install downloaded runtime assets
        run: |
          set -euo pipefail
          mkdir -p hermes/Frameworks
          unzip -q runtime-artifact/native/HermesRuntime.framework.zip -d hermes/Frameworks
          cp runtime-artifact/python/hermesrt.zip hermes/hermesrt.zip
          test -x hermes/Frameworks/HermesRuntime.framework/HermesRuntime
          bash install_hermes_runtime.sh hermes

      - name: Cache framework builds
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            xcfs/.build
            Frameworks/ios_system/xcfs/.build
          key: ${{ runner.os }}-${{ hashFiles('get_frameworks.sh', 'xcfs/Package.swift') }}

      - name: Get frameworks
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash get_frameworks.sh

      - name: Get resources
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash get_resources.sh

      - name: Prepare Xcode configuration
        run: cp template_setup.xcconfig developer_setup.xcconfig

      - name: Run HermesLink tests
        if: ${{ inputs.run_tests == true }}
        continue-on-error: true
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available | grep -m1 -Eo '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')"
          test -n "$simulator_id"
          set -o pipefail
          xcodebuild -project Blink.xcodeproj -scheme BlinkTests -sdk iphonesimulator -destination "id=$simulator_id" test | xcpretty

      - name: Build unsigned device archive
        if: steps.app_build_cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Blink.xcodeproj \
            -scheme Blink \
            -sdk iphoneos \
            -configuration Debug \
            -archivePath "$RUNNER_TEMP/HermesLink.xcarchive" \
            IPHONEOS_DEPLOYMENT_TARGET='16.1' \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO | tee "$RUNNER_TEMP/hermeslink-archive.log" | xcpretty

      - name: Validate cached unsigned device archive
        if: steps.app_build_cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP/HermesLink.xcarchive/Products/Applications"
          test -n "$(find "$RUNNER_TEMP/HermesLink.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"

      - name: Refresh embedded runtime in archive
        run: |
          set -euo pipefail
          app="$(find "$RUNNER_TEMP/HermesLink.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          install -m 644 runtime-artifact/python/hermesrt.zip "$app/hermesrt.zip"
          test -s "$app/hermesrt.zip"

      - name: Package IPA
        run: |
          set -euo pipefail
          app="$(find "$RUNNER_TEMP/HermesLink.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          test -x "$app/Frameworks/HermesRuntime.framework/HermesRuntime"
          codesign --force --sign - --timestamp=none "$app/Frameworks/HermesRuntime.framework"
          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          rm -rf "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/HermesLink.ipa"
          mkdir -p "$RUNNER_TEMP/Payload/HermesLink.app"
          /usr/bin/ditto "$app" "$RUNNER_TEMP/Payload/HermesLink.app"
          test "$(find "$RUNNER_TEMP/Payload" -mindepth 1 -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')" = 1
          test -f "$RUNNER_TEMP/Payload/HermesLink.app/Info.plist"
          test -x "$RUNNER_TEMP/Payload/HermesLink.app/HermesLink"
          (cd "$RUNNER_TEMP" && /usr/bin/zip -qry -X HermesLink.ipa Payload)
          unzip -Z1 "$RUNNER_TEMP/HermesLink.ipa" | grep -Fx 'Payload/HermesLink.app/Info.plist'
          unzip -Z1 "$RUNNER_TEMP/HermesLink.ipa" | grep -Fx 'Payload/HermesLink.app/HermesLink'
          unzip -Z1 "$RUNNER_TEMP/HermesLink.ipa" | grep -Fx 'Payload/HermesLink.app/hermesrt.zip'
          unzip -Z1 "$RUNNER_TEMP/HermesLink.ipa" | grep -Fx 'Payload/HermesLink.app/Frameworks/HermesRuntime.framework/HermesRuntime'

      - name: Upload universal HermesLink IPA
        uses: actions/upload-artifact@v4
        with:
          name: hermeslink-ipa
          path: ${{ runner.temp }}/HermesLink.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload archive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermeslink-archive-log
          path: ${{ runner.temp }}/hermeslink-archive.log
          if-no-files-found: ignore
