name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run Blink tests before archiving
        required: false
        type: boolean
        default: false

jobs:
  hermes-runtime:
    uses: ./.github/workflows/build-hermes.yml
    permissions:
      contents: write

  build:
    needs: hermes-runtime
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out Blink
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download Hermes runtime
        uses: actions/download-artifact@v4
        with:
          name: hermes-ios-runtime
          path: hermes-artifact

      - name: Install Hermes runtime into app resources
        run: |
          chmod +x install_hermes_runtime.sh
          ./install_hermes_runtime.sh "$GITHUB_WORKSPACE/hermes-artifact"

      - name: Cache framework builds
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            xcfs/.build
            Frameworks/ios_system/xcfs/.build
          key: ${{ runner.os }}-${{ hashFiles('get_frameworks.sh', 'xcfs/Package.swift') }}

      - name: Get frameworks
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./get_frameworks.sh

      - name: Get resources
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./get_resources.sh

      - name: Prepare Xcode configuration
        run: cp template_setup.xcconfig developer_setup.xcconfig

      - name: Run Blink tests
        if: ${{ inputs.run_tests == true }}
        continue-on-error: true
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available | grep -m1 -Eo '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')"
          test -n "$simulator_id"
          set -o pipefail
          xcodebuild -project Blink.xcodeproj -scheme BlinkTests -sdk iphonesimulator -destination "id=$simulator_id" test | xcpretty

      - name: Build unsigned device archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Blink.xcodeproj \
            -scheme Blink \
            -sdk iphoneos \
            -configuration Debug \
            -archivePath "$RUNNER_TEMP/Blink.xcarchive" \
            IPHONEOS_DEPLOYMENT_TARGET='16.1' \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO | tee "$RUNNER_TEMP/blink-archive.log" | xcpretty

      - name: Package IPA
        run: |
          set -euo pipefail
          app="$(find "$RUNNER_TEMP/Blink.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          test -x "$app/hermes"
          # TrollStore can install an unsigned app, but iOS still requires
          # every executable launched from the app bundle to have a valid
          # code signature. Sign the bundled Hermes executable first, then
          # ad-hoc sign the complete app bundle around it.
          codesign --force --sign - --timestamp=none "$app/hermes"
          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          rm -rf "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/HermesLink.ipa"
          mkdir -p "$RUNNER_TEMP/Payload/HermesLink.app"
          /usr/bin/ditto "$app" "$RUNNER_TEMP/Payload/HermesLink.app"
          test "$(find "$RUNNER_TEMP/Payload" -mindepth 1 -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')" = 1
          test -f "$RUNNER_TEMP/Payload/HermesLink.app/Info.plist"
          test -x "$RUNNER_TEMP/Payload/HermesLink.app/HermesLink"
          (cd "$RUNNER_TEMP" && /usr/bin/zip -qry -X HermesLink.ipa Payload)
          unzip -Z1 "$RUNNER_TEMP/HermesLink.ipa" | grep -Fx 'Payload/HermesLink.app/Info.plist'
          unzip -Z1 "$RUNNER_TEMP/HermesLink.ipa" | grep -E '^Payload/HermesLink\.app/(HermesLink|hermes|hermesrt\.zip)$'

      - name: Upload universal HermesLink IPA
        uses: actions/upload-artifact@v4
        with:
          name: hermeslink-ipa
          path: ${{ runner.temp }}/HermesLink.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload archive log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blink-archive-log
          path: ${{ runner.temp }}/blink-archive.log
          if-no-files-found: ignore
